<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>かっこいい 先輩</title>
  <style>
    body { font-family: sans-serif; max-width: 800px; margin: 2em auto; line-height: 1.8; }
    .header { display: flex; align-items: center; gap: 1em; margin-bottom: 1em; }
    .back-btn { background: none; border: none; cursor: pointer; font-size: 1.5em; padding: 0.5em; opacity: 0.7; transition: opacity 0.2s; text-decoration: none; color: #0066cc; }
    .back-btn:hover { opacity: 1; }
    .title-container { display: flex; align-items: center; gap: 0.5em; flex: 1; }
    .title-container h1 { margin: 0; }
    .audio-controls { display: flex; align-items: center; gap: 0.3em; }
    .audio-btn-title { background: none; border: none; cursor: pointer; font-size: 1.2em; padding: 0.2em 0.5em; opacity: 0.6; transition: opacity 0.2s; }
    .audio-btn-title:hover { opacity: 1; }
    .pause-play-btn { background: none; border: none; cursor: pointer; font-size: 1.2em; padding: 0.2em 0.5em; opacity: 0; transition: opacity 0.2s; display: none; }
    .pause-play-btn.show { display: inline-block; opacity: 0.6; }
    .pause-play-btn:hover { opacity: 1; }
    .content { font-size: 1.2em; margin: 2em 0; padding: 1em; }
    .audio-btn-inline { background: none; border: none; cursor: pointer; font-size: 0.7em; padding: 0 0.2em; margin: 0 0.3em; opacity: 0.5; transition: opacity 0.2s; }
    .audio-btn-inline:hover { opacity: 1; }
    ruby { color: #333; }
    rt { font-size: 0.7em; color: #666; }
    .vocab { margin-top: 2em; }
  </style>
  <script>
    let currentUtterance = null;
    let pauseTimeout = null;
    
    function playAudio(text) {
      // Use Web Speech API for text-to-speech
      if ('speechSynthesis' in window) {
        // Cancel any ongoing speech
        speechSynthesis.cancel();
        if (pauseTimeout) clearTimeout(pauseTimeout);
        
        currentUtterance = new SpeechSynthesisUtterance(text);
        currentUtterance.lang = 'ja-JP';  // Set language to Japanese
        currentUtterance.rate = 0.8;       // Slightly slower speech for clarity
        
        // Update pause button visibility and state
        currentUtterance.onstart = function() {
          updatePauseButtonVisibility(true);
        };
        
        currentUtterance.onend = function() {
          updatePauseButtonVisibility(false);
        };
        
        speechSynthesis.speak(currentUtterance);
      } else {
        alert('Text-to-Speech not supported in this browser');
      }
    }
    
    function playAudioWithTitlePause() {
      // Play title, pause 1 seconds, then play content
      if ('speechSynthesis' in window) {
        // Cancel any ongoing speech
        speechSynthesis.cancel();
        if (pauseTimeout) clearTimeout(pauseTimeout);
        
        // First, play the title
        const titleUtterance = new SpeechSynthesisUtterance('かっこいい 先輩');
        titleUtterance.lang = 'ja-JP';
        titleUtterance.rate = 0.8;
        
        titleUtterance.onstart = function() {
          updatePauseButtonVisibility(true);
        };
        
        titleUtterance.onend = function() {
          // After title ends, wait 1 second then play content
          pauseTimeout = setTimeout(function() {
            const contentUtterance = new SpeechSynthesisUtterance('サッカー部に かっこいい 先輩が います。 田中さんは その 人が とても 好きです。 山本さんも 好きです。 きのう、その 先輩は 元気じゃなかったです。 でも、きょうは 元気です。 元気な 先輩は もっと かっこいいですね。');
            contentUtterance.lang = 'ja-JP';
            contentUtterance.rate = 0.8;
            
            contentUtterance.onend = function() {
              updatePauseButtonVisibility(false);
              currentUtterance = null;
            };
            
            currentUtterance = contentUtterance;
            speechSynthesis.speak(contentUtterance);
          }, 1000);
        };
        
        currentUtterance = titleUtterance;
        speechSynthesis.speak(titleUtterance);
      } else {
        alert('Text-to-Speech not supported in this browser');
      }
    }
    
    function togglePause() {
      if (!currentUtterance) return;
      
      if (speechSynthesis.paused) {
        speechSynthesis.resume();
        document.getElementById('pausePlayBtn').textContent = '⏸';
      } else {
        speechSynthesis.pause();
        document.getElementById('pausePlayBtn').textContent = '▶';
      }
    }
    
    function updatePauseButtonVisibility(isPlaying) {
      const btn = document.getElementById('pausePlayBtn');
      if (isPlaying) {
        btn.classList.add('show');
        btn.textContent = '⏸';
      } else {
        btn.classList.remove('show');
      }
    }
  </script>
</head>
<body>
  <div class="header">
    <a href="index.html" class="back-btn" title="Back to lessons">←</a>
    <div class="title-container">
      <h1>かっこいい 先輩</h1>
      <div class="audio-controls">
        <button class="audio-btn-title" onclick="playAudioWithTitlePause()" title="Read entire text">🔊</button>
        <button id="pausePlayBtn" class="pause-play-btn" onclick="togglePause()" title="Pause/Resume">⏸</button>
      </div>
    </div>
  </div>

  <div class="content">
    サッカー<ruby>部<rt>ぶ</rt></ruby>にかっこいい<ruby>先輩<rt>せんぱい</rt></ruby>がいます。<button class="audio-btn-inline" onclick="playAudio('サッカー部に かっこいい 先輩が います。')" title="Listen">🔉</button> <ruby>田中<rt>たなか</rt></ruby>さんはその<ruby>人<rt>ひと</rt></ruby>がとても<ruby>好き<rt>すき</rt></ruby>です。<button class="audio-btn-inline" onclick="playAudio('田中さんは その 人が とても 好きです。')" title="Listen">🔉</button> <ruby>山本<rt>やまもと</rt></ruby>さんも<ruby>好き<rt>すき</rt></ruby>です。<button class="audio-btn-inline" onclick="playAudio('山本さんも 好きです。')" title="Listen">🔉</button> きのう、その<ruby>先輩<rt>せんぱい</rt></ruby>は<ruby>元気<rt>げんき</rt></ruby>じゃなかったです。<button class="audio-btn-inline" onclick="playAudio('きのう、その 先輩は 元気じゃなかったです。')" title="Listen">🔉</button> でも、きょうは<ruby>元気<rt>げんき</rt></ruby>です。<button class="audio-btn-inline" onclick="playAudio('でも、きょうは 元気です。')" title="Listen">🔉</button> <ruby>元気<rt>げんき</rt></ruby>な<ruby>先輩<rt>せんぱい</rt></ruby>はもっとかっこいいですね。<button class="audio-btn-inline" onclick="playAudio('元気な 先輩は もっと かっこいいですね。')" title="Listen">🔉</button> 
  </div>

  <hr>

  <div class="vocab">
    <h2>Vocabulary</h2>
    <ul>
      <li>サッカー – soccer</li>
      <li>部 – club</li>
      <li>先輩 – senior</li>
      <li>元気 – healthy/energetic</li>
      <li>かっこいい – cool/handsome</li>
    </ul>
  </div>
</body>
</html>
